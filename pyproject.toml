[project]
name = "ultron"
version = "1.0.0"
description = "Collective memory and skill hub for general assistants: shared remote memory, semantic search, and skill packages."
readme = "README.md"
authors = [{ name = "ModelScope Contributors" }]
requires-python = ">=3.9"
license = { text = "MIT" }

# Core dependencies: only what the CLI commands (upload/download/watch/convert/restore) need.
# These are safe to bundle into modelscope as thin additions.
dependencies = [
  "requests>=2.25.0",
  "modelscope_hub>=0.0.7",
]

[project.optional-dependencies]
# Full ultron server (API + LLM + embeddings + auth + sanitization)
server = [
  "fastapi>=0.100.0",
  "uvicorn>=0.22.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "PyJWT>=2.8.0",
  "bcrypt>=4.0.0",
  "dashscope>=1.14.0",
  "openai>=1.0.0",
  "transformers>=4.51.0",
  "sentence-transformers>=2.7.0",
  "tiktoken>=0.5.0",
  "tqdm>=4.66.0",
  "presidio-analyzer>=2.2.354",
  "presidio-anonymizer>=2.2.362",
]
# Test suite
test = [
  "pytest>=7.0.0",
  "pytest-asyncio",
]
# Install everything
all = [
  "ultron[server]",
]

[project.scripts]
ultron = "ultron.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ultron*"]
